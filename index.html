<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jimmykiang.github.io</title>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi"
          crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/showcase.css">
    <script src="./assets/js/flock-background.js" defer></script>
</head>
<body>
<canvas id="heading-flock" aria-hidden="true"></canvas>
<div class="container showcase-content">
    <div class="showcase-layout mt-4">
        <div class="showcase-panel text-center text-lg-start">
            <h2 class="h4 fw-light mb-0">Hi, I'm Jimmy and these are some of my eye candy adventures
                made with Go and Rust!</h2>
            <hr class="mt-2 mb-5">
            <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel" data-flock-obstacle>
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#indicator" data-bs-slide-to="0" class="active" aria-current="true"
                            aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#indicator" data-bs-slide-to="1" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#indicator" data-bs-slide-to="2" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#indicator" data-bs-slide-to="3" aria-label="Slide 3"></button>
                    <button type="button" data-bs-target="#indicator" data-bs-slide-to="4" aria-label="Slide 4"></button>
                    <button type="button" data-bs-target="#indicator" data-bs-slide-to="5" aria-label="Slide 5"></button>
                    <button type="button" data-bs-target="#indicator" data-bs-slide-to="6" aria-label="Slide 6"></button>
                    <button type="button" data-bs-target="#indicator" data-bs-slide-to="7" aria-label="Slide 7"></button>
                    <button type="button" data-bs-target="#indicator" data-bs-slide-to="8" aria-label="Slide 8"></button>

                </div>

                <div class="carousel-inner">
                    <div class="carousel-item active bg-white" data-bs-interval="15000" keyboard="false">
                        <canvas id="glcanvas" width="640" height="380" class="d-block w-100"></canvas>
                        <script src="./gl.js"></script>
                        <script>load("wphysics.wasm");</script>
                    </div>
                    <div class="carousel-item" data-bs-interval="99999999999" keyboard="false">
                        <canvas id="canvas" width="640" height="480" class="d-block w-100"></canvas>
                        <script src="./asciirunner.js"></script>
                        <script>
                            window.addEventListener("load", async () => {
                                await wasm_bindgen("./asciirunner_bg.wasm");
                            });
                        </script>
                    </div>
                    <div class="carousel-item" keyboard="false">
                        <img src="/assets/images/reflectionWorld2.jpeg" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item" keyboard="false">
                        <img src="/assets/images/reflectionWorld.jpeg" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item" keyboard="false">
                        <img src="/assets/images/csg.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item" keyboard="false">
                        <img src="/assets/images/cow.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item" keyboard="false">
                        <img src="/assets/images/uvMap.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item" keyboard="false">
                        <img src="/assets/images/sph3D.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item" keyboard="false">
                        <img src="/assets/images/liquidPhysics.gif" class="d-block w-100" alt="...">
                    </div>

                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
                            data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
                            data-bs-slide="next" color="red">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>


            </div>
        </div>
        <section class="showcase-panel text-center text-lg-start" aria-labelledby="vision-gallery-title"
                 data-flock-obstacle>
            <h2 class="h4 fw-light mb-0" id="vision-gallery-title">...and some fun with applied AI and Computer Vision!</h2>
            <hr class="mt-2 mb-5">
            <div>
                <div class="row row-cols-1 row-cols-lg-3 g-4">
                    <div class="col">
                        <figure class="vision-card">
                            <a href="./assets/images/car.png" aria-haspopup="dialog">
                                <img src="./assets/images/car.png" width="1024" height="1536" decoding="async"
                                     alt="Highway scene with speed limit, route sign, and license plate labels above the original view.">
                            </a>
                        </figure>
                    </div>
                    <div class="col">
                        <figure class="vision-card">
                            <a href="./assets/images/car2.png" aria-haspopup="dialog">
                                <img src="./assets/images/car2.png" width="1024" height="1536" loading="lazy" decoding="async"
                                     alt="City traffic scene with direction sign, pedestrian crossing, and license plate labels above the original view.">
                            </a>
                        </figure>
                    </div>
                    <div class="col">
                        <figure class="vision-card">
                            <a href="./assets/images/car3.png" aria-haspopup="dialog">
                                <img src="./assets/images/car3.png" width="1024" height="1536" loading="lazy" decoding="async"
                                     alt="Intersection scene with stop sign, pedestrian crossing, and license plate labels above the original view.">
                            </a>
                        </figure>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <div>
        <h5 class="fw-light text-center text-lg-start mt-4 mb-0">
            📫 you can reach me at: <a href="mailto:castlevanity@gmail.com">castlevanity@gmail.com</a>

        </h5>

        <h5 class="fw-light text-center text-lg-start mt-4 mb-0">

            <a href="https://github.com/jimmykiang">GitHub</a>
        </h5>

    </div>
</div>

<div class="modal fade" id="vision-preview" tabindex="-1" aria-labelledby="vision-preview-title"
     aria-describedby="vision-preview-hint" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-xl">
        <div class="modal-content">
            <div class="modal-header d-block">
                <h2 class="modal-title fs-5" id="vision-preview-title">Computer Vision Preview</h2>
            </div>
            <div class="modal-body p-0">
                <button type="button" class="vision-preview-dismiss" data-bs-dismiss="modal"
                        aria-label="Return to gallery" aria-describedby="vision-preview-photo"></button>
            </div>
        </div>
    </div>
</div>
<script>
    if (window.bootstrap?.Modal) {
        const visionPreview = document.getElementById("vision-preview");
        const visionPreviewDismiss = visionPreview.querySelector(".vision-preview-dismiss");
        const previewModal = new bootstrap.Modal(visionPreview);

        for (const link of document.querySelectorAll(".vision-card a")) {
            link.addEventListener("click", (event) => {
                if (event.defaultPrevented || event.button !== 0 || event.ctrlKey || event.metaKey ||
                    event.shiftKey || event.altKey) {
                    return;
                }

                event.preventDefault();
                previewModal.show(link);
            });
        }

        visionPreview.addEventListener("show.bs.modal", ({ relatedTarget: link }) => {
            const image = link.querySelector("img").cloneNode();
            image.id = "vision-preview-photo";
            image.src = link.href;
            image.loading = "eager";
            image.classList.add("img-fluid", "d-block");
            visionPreviewDismiss.replaceChildren(image);
            document.documentElement.classList.add("vision-preview-open");

            visionPreview.addEventListener("hidden.bs.modal", () => {
                document.documentElement.classList.remove("vision-preview-open");
                link.focus({ preventScroll: true });
            }, { once: true });
        });
    }
</script>
</body>
</html>
